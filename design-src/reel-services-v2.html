<title>Elreda — services reel v2 (motion source)</title>
<!--
  Reel v2: particles, flying props, camera shake, whip pans, RGB split, confetti.
  Every frame is drawn by seek(t) (seconds), so the render is deterministic and matches
  the soundtrack built by build/reel_audio.py (120 BPM, beat = 0.5 s).
  Render: python3 -m http.server 8899 from the repo root, then node build/reel.js --v2
  Reels safe zone: keep text between y≈260 and y≈1500.
-->
<style>
@font-face{font-family:T;src:url(/build/fonts/tajawal-arabic-500-normal.woff2);font-weight:500}
@font-face{font-family:T;src:url(/build/fonts/tajawal-arabic-800-normal.woff2);font-weight:800}
@font-face{font-family:T;src:url(/build/fonts/tajawal-arabic-900-normal.woff2);font-weight:900}
@font-face{font-family:M;src:url(/build/fonts/manrope-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:M;src:url(/build/fonts/manrope-latin-800-normal.woff2);font-weight:800}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#08080A}
body{font-family:T,M,sans-serif;color:#F5F5F5;position:relative}
.abs{position:absolute}
#world{inset:0;transform-origin:540px 960px}
#bg{inset:-80px;background:linear-gradient(165deg,#191920 0%,#0E0E12 50%,#07070A 100%)}
#grid{inset:-300px;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:90px 90px;-webkit-mask:radial-gradient(circle at 50% 45%,#000 0%,transparent 68%)}
.glow{border-radius:50%;background:radial-gradient(circle,rgba(212,32,39,.55),transparent 65%);filter:blur(20px)}
canvas{position:absolute;left:0;top:0}
#frame{inset:46px;border:1.5px solid rgba(255,255,255,.12);border-radius:40px}
#grain{left:-100px;top:-100px;opacity:.11;mix-blend-mode:overlay;pointer-events:none}
#flash{inset:0;background:#fff;opacity:0;mix-blend-mode:screen}
#vig{inset:0;background:radial-gradient(ellipse at 50% 48%,transparent 55%,rgba(0,0,0,.55) 100%)}
.sc{inset:0}
.w{display:inline-block;will-change:transform}
h1,h2{font-weight:900;line-height:1.15;text-align:center}
.em{color:#FF4950}
.chip{display:inline-flex;align-items:center;gap:14px;font-weight:800;font-size:44px;padding:20px 32px;border-radius:999px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.18);white-space:nowrap;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.chip i{width:14px;height:14px;border-radius:50%;background:#D42027;flex:none;box-shadow:0 0 14px #ff3b42}
.ibox{width:220px;height:220px;border-radius:56px;display:grid;place-items:center;background:linear-gradient(150deg,#E0262D,#8B1E21);box-shadow:0 30px 90px rgba(212,32,39,.5);overflow:hidden}
.ibox svg{width:120px;height:120px;color:#fff;position:relative}
.ibox .sw{position:absolute;inset:-40%;background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%)}
.num{font:800 420px/1 M;color:transparent;-webkit-text-stroke:3px rgba(255,255,255,.13);letter-spacing:-12px;direction:ltr}
.tag{font:800 30px M;letter-spacing:.3em;color:#FF5A60;text-align:center;direction:ltr}
.bars{display:flex;gap:14px;direction:rtl}
.bars span{width:120px;height:8px;border-radius:8px;background:rgba(255,255,255,.14);overflow:hidden;position:relative}
.bars span b{position:absolute;inset:0;background:#D42027;transform-origin:100% 50%;box-shadow:0 0 12px #ff3b42}
.pill{font-weight:800;font-size:50px;padding:20px 40px;border-radius:999px;border:2px solid rgba(255,255,255,.25);background:rgba(18,18,24,.85);white-space:nowrap;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.ltr{direction:ltr;unicode-bidi:isolate;font-family:M}
/* props */
.prop{transform-style:preserve-3d}
.card{border-radius:18px;box-shadow:0 30px 70px rgba(0,0,0,.5)}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.03));border:1.5px solid rgba(255,255,255,.2);border-radius:26px;box-shadow:0 30px 70px rgba(0,0,0,.45)}
.ln{height:12px;border-radius:6px;background:rgba(255,255,255,.18);margin:12px 0}
.dk .ln{background:rgba(0,0,0,.12)}
.bubble{border-radius:34px;padding:26px 30px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.dots{display:flex;gap:12px}.dots b{width:18px;height:18px;border-radius:50%;background:#2a2a33}
#D_bg{inset:0;background:radial-gradient(900px 900px at 50% 30%,#E7333A,#B81C22 55%,#6E1216)}
.mk{width:300px}
#D_sweep,#A_sweep{-webkit-mask:url(/assets/img/logo-mark.png) center/contain no-repeat;background:linear-gradient(100deg,transparent 38%,rgba(255,255,255,.9) 50%,transparent 62%);background-size:300% 100%}
</style>
</head>

<script>
// ---------- helpers
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const r=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const ei=x=>x*x*x;
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c=1.9,d=c+1;return 1+d*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const elastic=x=>x<=0?0:x>=1?1:Math.pow(2,-10*x)*Math.sin((x*10-.75)*2*Math.PI/3)+1;
const lerp=(a,b,x)=>a+(b-a)*x;
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// generic transform: o opacity, x y z px, s scale, r rot deg, rx ry 3D deg, b blur px
function tf(el,{o=1,x=0,y=0,z=0,s=1,r:rot=0,rx=0,ry=0,b=0}={}){
  el.style.opacity=cl(o);
  el.style.transform=`perspective(1600px) translate3d(${x}px,${y}px,${z}px) rotateX(${rx}deg) rotateY(${ry}deg) rotate(${rot}deg) scale(${s})`;
  el.style.filter=b>0.3?`blur(${b.toFixed(1)}px)`:'';
}
function words(el){return [...el.querySelectorAll('.w')]}

// ---------- timeline (s) — keep in sync with build/reel_audio.py
const T={A:[0,5],B:[5,17.5],C:[17.5,21.5],D:[21.5,27]};
const PD=2.5;                       // seconds per pillar (5 beats)
const IMPACTS=[[2.0,26],[2.25,10],[2.5,12],[3.5,14],[22.0,30],[26.0,8]]; // [time, shake px]
const BEAT0=2.0, BEAT=.5;

// ---------- pillar content
const IC={
 design:'M12 19l7-7 3 3-7 7-3-3z M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z M2 2l7.6 7.6 M13 11a2 2 0 1 1-4 0 2 2 0 0 1 4 0z',
 print:'M6 9V2h12v7 M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2 M6 14h12v8H6z',
 web:'M2 4h20v14H2z M8 22h8 M12 18v4 M2 8h20',
 acc:'M5 2h14v20l-3-2-2 2-2-2-2 2-2-2-3 2z M9 7h6 M9 11h6 M9 15h4',
 ai:'M7 7h10v10H7z M10 10h4v4h-4z M9 2v3 M15 2v3 M9 19v3 M15 19v3 M2 9h3 M2 15h3 M19 9h3 M19 15h3'};
const P=[
 {k:'design',tag:'DESIGN',t:['التصميم'],c:['هوية بصرية كاملة','سوشيال ميديا','يافطات ولوحات']},
 {k:'print',tag:'PRINT',t:['الطباعة'],c:['كروت وأوراق رسمية','بروشور ومنيو','رول أب وتشطيبات']},
 {k:'web',tag:'WEB & STORES',t:['المواقع','والمتاجر'],c:['موقع لشركتك','متجر ببوابات دفع','ظهور في جوجل']},
 {k:'acc',tag:'ACCOUNTING',t:['الأنظمة','المحاسبية'],c:['نظام «فكترة»','الفاتورة الإلكترونية','مصر والإمارات']},
 {k:'ai',tag:'AI & SOFTWARE',t:['حلول','برمجية','وذكاء','اصطناعي'],c:['أتمتة الشغل','شات بوت واتساب','أنظمة مخصّصة']}];
const LOGO='/assets/img/logo-mark.png', WM_L='/assets/img/wordmark-light.png', WM_D='/assets/img/wordmark-dark.png';
const lines=(n,w=[100,80,92,64,86])=>Array.from({length:n},(_,i)=>`<div class="ln" style="width:${w[i%w.length]}%"></div>`).join('');
// props: [html, left, top, side(+1 from right / -1 from left)]
const PROPS=[
 [ // design
  [`<div style="position:relative;width:260px;height:250px">${['#1d1d24','#F5F5F5','#D42027'].map((c,i)=>`<div class="card" style="position:absolute;left:${50+i*10}px;top:20px;width:140px;height:210px;background:${c};transform-origin:50% 100%;transform:rotate(${-22+i*22}deg);border:1.5px solid rgba(255,255,255,.15)"><div style="position:absolute;bottom:16px;left:16px;right:16px;height:10px;border-radius:5px;background:${i==1?'rgba(0,0,0,.15)':'rgba(255,255,255,.25)'}"></div></div>`).join('')}</div>`,60,440,-1],
  [`<div class="glass" style="width:210px;height:200px;display:grid;place-items:center"><svg width="170" height="150" viewBox="0 0 170 150"><path d="M15 120 C 50 10, 120 10, 155 110" fill="none" stroke="#fff" stroke-width="4"/><line x1="15" y1="120" x2="60" y2="40" stroke="#FF5A60" stroke-width="2"/><line x1="155" y1="110" x2="115" y2="30" stroke="#FF5A60" stroke-width="2"/><rect x="7" y="112" width="16" height="16" fill="#D42027"/><rect x="147" y="102" width="16" height="16" fill="#D42027"/><circle cx="60" cy="40" r="7" fill="#fff"/><circle cx="115" cy="30" r="7" fill="#fff"/></svg></div>`,800,420,1],
  [`<div class="glass" style="width:180px;height:180px;display:grid;place-items:center;font:800 92px M;color:#fff">Aa</div>`,840,680,1]],
 [ // print
  [`<div class="card" style="width:330px;height:190px;background:#F7F5F2;display:flex;align-items:center;gap:16px;padding:0 26px"><img src="${LOGO}" style="width:96px"><div style="flex:1"><img src="${WM_L}" style="width:100%"><div style="height:8px;border-radius:4px;background:#D42027;width:60%;margin-top:14px"></div></div></div>`,30,460,-1],
  [`<div class="card" style="width:260px;height:150px;background:linear-gradient(150deg,#E0262D,#8B1E21);display:grid;place-items:center"><img src="${LOGO}" style="width:88px;filter:brightness(0) invert(1)"></div>`,790,410,1],
  [`<div class="card dk" style="width:170px;height:235px;background:#F2F0EC;padding:20px"><div style="height:70px;border-radius:10px;background:#D42027"></div>${lines(5)}</div>`,850,660,1]],
 [ // web
  [`<div class="card" style="width:340px;height:236px;background:#15151b;border:1.5px solid rgba(255,255,255,.18);overflow:hidden"><div style="height:34px;background:#24242c;display:flex;gap:9px;align-items:center;padding:0 14px"><i style="width:12px;height:12px;border-radius:50%;background:#ff5f57"></i><i style="width:12px;height:12px;border-radius:50%;background:#febc2e"></i><i style="width:12px;height:12px;border-radius:50%;background:#28c840"></i></div><div style="padding:18px"><div style="height:80px;border-radius:12px;background:linear-gradient(120deg,#D42027,#7E161A)"></div>${lines(3)}</div></div>`,30,450,-1],
  [`<div class="card" style="width:156px;height:310px;border-radius:32px;background:#111116;border:5px solid #2b2b33;padding:14px;overflow:hidden"><div style="height:110px;border-radius:16px;background:linear-gradient(150deg,#E0262D,#8B1E21)"></div>${lines(4)}<div style="height:34px;border-radius:17px;background:#D42027;margin-top:16px"></div></div>`,850,420,1],
  [`<svg width="90" height="90" viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.6L10 19z" fill="#fff" stroke="#111" stroke-width="1"/></svg>`,330,740,-1]],
 [ // accounting
  [`<div class="card dk" style="width:236px;height:318px;background:#F7F5F2;padding:22px;color:#111"><div style="display:flex;justify-content:space-between;align-items:center"><img src="${LOGO}" style="width:46px"><div style="font:900 30px T;color:#D42027">فاتورة</div></div>${lines(4)}<div style="display:grid;grid-template-columns:repeat(6,12px);gap:3px;margin-top:18px">${Array.from({length:36},(_,i)=>`<i style="width:12px;height:12px;background:${[0,1,2,5,6,11,13,14,16,19,21,22,24,27,29,30,33,34,35,7,18].includes(i)?'#111':'transparent'}"></i>`).join('')}</div></div>`,50,430,-1],
  [`<div class="glass" style="width:230px;height:180px;padding:24px;display:flex;align-items:flex-end;gap:16px">${[40,70,55,100,85].map((h,i)=>`<i class="bar" data-h="${h}" style="flex:1;height:${h}%;border-radius:8px 8px 3px 3px;background:${i==3?'#D42027':'rgba(255,255,255,.35)'};transform-origin:50% 100%"></i>`).join('')}</div>`,800,440,1],
  [`<div style="width:120px;height:120px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 20px 50px rgba(0,0,0,.4)"><svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="#D42027" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>`,880,690,1]],
 [ // ai
  [`<div class="bubble" style="background:#F5F5F5;width:210px"><div class="dots"><b></b><b></b><b></b></div></div>`,60,470,-1],
  [`<div class="bubble" style="background:linear-gradient(150deg,#E0262D,#8B1E21);width:260px;padding:22px 26px">${lines(2,[100,70])}</div>`,40,640,-1],
  [`<svg width="230" height="230" viewBox="0 0 230 230"><g stroke="rgba(255,255,255,.35)" stroke-width="3"><line x1="40" y1="60" x2="120" y2="110"/><line x1="120" y1="110" x2="190" y2="50"/><line x1="120" y1="110" x2="170" y2="190"/><line x1="40" y1="60" x2="60" y2="180"/><line x1="60" y1="180" x2="120" y2="110"/></g><g fill="#fff"><circle cx="40" cy="60" r="14"/><circle cx="190" cy="50" r="12"/><circle cx="170" cy="190" r="14"/><circle cx="60" cy="180" r="11"/></g><circle cx="120" cy="110" r="22" fill="#D42027"/><path d="M120 92 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z" fill="#fff"/></svg>`,800,450,1]],
];
// build pillar groups
const B=$('B'), G=[];
P.forEach((p,i)=>{
  const g=document.createElement('div'); g.className='abs sc'; g.style.opacity=0;

        c.globalCompositeOperation='lighter';dot(c,SPR.red,p[0],p[1],90+20*Math.sin(t*6+k),a*(1-out));c.globalCompositeOperation='source-over';
        c.globalAlpha=a*(1-out);c.fillStyle='#fff';c.beginPath();c.arc(p[0],p[1],10,0,6.283);c.fill();
        const pr=((t*1.2+k*.3)%1);c.strokeStyle='#FF5A60';c.lineWidth=3;c.globalAlpha=a*(1-pr)*(1-out);c.beginPath();c.arc(p[0],p[1],12+50*pr,0,6.283);c.stroke();c.globalAlpha=1});
      // flight paths + planes
      routes.forEach(([s,e,t0,dur,h],k)=>{const a=pp[s],b=pp[e],uu=eio(r(u,t0,t0+dur)),pl=$('C_pl'+(k+1));
        if(uu<=0){pl.style.opacity=0;return}
        c.setLineDash([10,12]);c.strokeStyle='rgba(255,255,255,.75)';c.lineWidth=3;c.globalAlpha=1-out;c.beginPath();
        for(let q=0;q<=40;q++){const w=uu*q/40,[x,y]=bez(a,b,h,w);q?c.lineTo(x,y):c.moveTo(x,y)}c.stroke();c.setLineDash([]);c.globalAlpha=1;
        const [x,y,ang]=bez(a,b,h,uu);const land=r(u,t0+dur,t0+dur+.25);

        f.globalCompositeOperation='lighter';for(let q=1;q<8;q++){const [tx,ty]=bez(a,b,h,Math.max(0,uu-q*.02));dot(f,SPR.white,tx,ty,22-q*2,.35*(1-q/8)*(1-land))}f.globalCompositeOperation='source-over';
        if(uu>=1)drawSparks(f,SPK2.slice(k*30,k*30+22),b[0],b[1],u-t0-dur);
      });
      // pills next to pins
      const pillAt=[[pp[0],.7,-1],[pp[1],routes[0][2]+routes[0][3],1],[pp[2],routes[1][2]+routes[1][3],1]];
      pillAt.forEach(([p,a,sd],k)=>{const el=$('C_p'+(k+1)),uu=r(u,a,a+.4),e=back(uu),w=el.offsetWidth,hh=el.offsetHeight;
        const px=k==0?p[0]-w/2:k==1?p[0]-w/2-20:p[0]-w/2, py=k==0?p[1]+40:k==1?p[1]+40:p[1]+40;
        el.style.left=px+'px';el.style.top=py+'px';tf(el,{o:r(u,a,a+.1)*(1-out),s:lerp(.2,1,e),y:30*(1-eo(uu))});
        if(k==1)el.style.background=`rgba(212,32,39,${.9*r(u,a+.2,a+.5)})`});
    }
    tf($('C_2'),{o:eo(r(u,2.2,2.7))*(1-out),y:40*(1-eo(r(u,2.2,2.7)))});
  }

  // ===== D
  // circular red wipe from the centre
  const wr=eio(r(t,T.D[0]-.2,T.D[0]+.35));
  $('D_bg').style.clipPath=`circle(${(wr*1250).toFixed(1)}px at 50% 52%)`; $('D_bg').style.opacity=wr>0?1:0;
  if(wr>0&&wr<1){f.strokeStyle='#fff';f.globalAlpha=1-wr;f.lineWidth=18;f.beginPath();f.arc(540,1000,wr*1250,0,6.283);f.stroke();f.globalAlpha=1}
  const inD=t>=T.D[0]; $('D').style.opacity=inD?1:0;
  if(inD){
    const u=t-T.D[0], hit=22.0-T.D[0];
    // logo falls from the camera and slams at 22.0

    tf($('D_mk'),{o:r(u,hit-.35,hit-.2),s:lerp(4.5,1,ei(fu))*(1+.12*Math.exp(-10*Math.max(0,u-hit))*(u>hit?1:0))*(1+.02*bp),b:16*(1-fu),r:-25*(1-fu)});
    $('D_sweep').style.opacity=r(u,hit,hit+.1); $('D_sweep').style.backgroundPosition=`${lerp(100,-50,r(u,hit+.3,hit+1.1))}% 0`;
    $('D_g').style.opacity=r(u,hit,hit+.3)*(.6+.4*Math.sin(u*2));
    rings(f,...LC,u-hit,'255,255,255',1000); drawSparks(f,SPK1,...LC,u-hit); flare(f,...LC,(1-r(u,hit,hit+.7))*(u>=hit?1:0));
    // confetti
    const cd=u-hit; if(cd>0){for(const p of CONF){const e=Math.exp(-p.k*cd),g=1500;
      const x=LC[0]+p.vx*(1-e)/p.k, y=LC[1]+(p.vy+g/p.k)*(1-e)/p.k-g*cd/p.k; if(y>2000)continue;
      f.save();f.translate(x+Math.sin(cd*3+p.r0)*20,y);f.rotate(p.r0+p.vr*cd);f.scale(Math.cos(p.sp*cd+p.r0),1);f.globalAlpha=1-r(cd,3.2,4.5);f.fillStyle=p.c;f.fillRect(-p.w/2,-p.h/2,p.w,p.h);f.restore()}f.globalAlpha=1}
    const wm=r(u,hit+.45,hit+.85); tf($('D_wm'),{o:wm,y:30*(1-eo(wm)),s:lerp(.85,1,eo(wm))}); $('D_wm').style.clipPath=`inset(0 0 0 ${100*(1-eo(wm))}%)`;
    words($('D_1')).forEach((w,k)=>{const a=hit+.95+k*.12,uu=r(u,a,a+.35);tf(w,{o:r(u,a,a+.1),y:-90*(1-back(uu)),rx:80*(1-eo(uu)),s:lerp(1.5,1,eo(uu))})});
    // phone number: digits roll in one by one
    const n=Math.floor(cl((u-(hit+1.45))/.035,0,PHONE.length)); const rq=rng(Math.floor(t*30));
    $('D_2').textContent=PHONE.slice(0,n)+(n<PHONE.length&&n>0?String(Math.floor(rq()*10)):'');
    tf($('D_2'),{o:r(u,hit+1.4,hit+1.5),s:1+.05*Math.exp(-8*Math.max(0,u-hit-2.05))*(u>hit+2.05?1:0)});
    tf($('D_3'),{o:eo(r(u,hit+2.0,hit+2.4)),y:30*(1-eo(r(u,hit+2.0,hit+2.4)))});
    const ig=r(u,hit+2.5,hit+2.9); tf($('D_4'),{o:ig,s:lerp(.4,1,elastic(ig))*(1+.035*Math.sin(u*5)*r(u,hit+3,hit+3.3))});
    drawSparks(f,SPK2.slice(40,70),540,1340,u-hit-2.6);
    // final sting at 26.0
    rings(f,...LC,t-26,'255,255,255',700); flare(f,...LC,(1-r(t,26,26.6))*(t>=26?.7:0));
    if(t>=26)drawSparks(f,SPK1.slice(0,40),...LC,t-26);
  }
}
window.DURATION=T.D[1]; window.seek=seek;
window.READY=new Promise(res=>{const im=$('A_mk');const go=()=>{buildLogoParticles();seek(0);res()};im.complete?go():im.onload=go});
